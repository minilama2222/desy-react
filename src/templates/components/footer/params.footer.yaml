params:
- name: meta
  type: object
  required: false
  description: Object containing options for the meta navigation.
  params:
  - name: visuallyHiddenTitle
    type: string
    description: Title for a meta item section, which defaults to Support links
  - name: html
    type: string
    description: HTML to add to the meta section of the footer, which will appear below any links specified using meta.items.
  - name: text
    type: string
    description: Text to add to the meta section of the footer, which will appear below any links specified using meta.items. If meta.html is specified, this option is ignored.
  - name: items
    type: array
    required: false
    description: Array of items for use in the meta section of the footer.
    params:
    - name: text
      type: string
      required: true
      description: List item text in the meta section of the footer.
    - name: html
      type: string
      required: false
      description: If `text` is set, this is not required. HTML to use in the list item. If `html` is provided, the `text` argument will be ignored.
    - name: href
      type: string
      required: true
      description: List item href attribute in the meta section of the footer.
    - name: attributes
      type: object
      required: false
      description: HTML attributes (for example data attributes) to add to the anchor in the footer meta section.
- name: description
  type: object
  required: false
  description: Object containing options for the description content. If not defined, it defaults to license and organization contact information from branding configuration.
  params:
  - name: visuallyHiddenTitle
    type: string
    description: Title for a meta item section, which defaults to Support links
  - name: html
    type: string
    description: HTML to add to the meta section of the footer, which will appear below any links specified using meta.items.
  - name: text
    type: string
    description: Text to add to the meta section of the footer, which will appear below any links specified using meta.items. If meta.html is specified, this option is ignored.
- name: navigation
  type: array
  required: false
  description: Array of items for use in the navigation section of the footer.
  params:
  - name: title
    type: string
    required: false
    description: Title for a section
  - name: columns
    type: integer
    required: false
    description: Amount of columns to display items in navigation section of the footer. Allowed values: from 1 to 8.
  - name: items
    type: array
    required: false
    description: Array of items to display in the list in navigation section of the footer.
    params:
    - name: text
      type: string
      required: true
      description: List item text in the navigation section of the footer.
    - name: html
      type: string
      required: false
      description: If `text` is set, this is not required. HTML to use in the list item. If `html` is provided, the `text` argument will be ignored.
    - name: href
      type: string
      required: true
      description: List item href attribute in the navigation section of the footer. Both `text` and `href` attributes need to be present to create a link.
    - name: attributes
      type: object
      required: false
      description: HTML attributes (for example data attributes) to add to the anchor in the footer navigation section.
  - name: classes
    type: string
    required: false
    description: Classes to add to the navigation item.
- name: noLogo
  type: boolean
  required: false
  description: When true, there will be no logo.
- name: logo
  type: object
  required: false
  description: This is the optional logo. Defaults to default `FEDER` type logo with default url link configured in branding.
  - name: html
    type: string
    required: false
    description: Use this html to insert a custom svg inline logo. If this is set, the type are not used.
  - name: url
    type: string
    required: false
    description: Add a custom link to the logo. Defaults to the URL configured in branding.
  - name: type
    type: string
    required: false
    description: Predefined icon types are `UE`, `FEDER`, `FSE+`, `FEADER` and `Plurifondo`. Defaults to `FEDER`.
  - name: containerClasses
    type: string
    required: false
    description: Classes applied to the parent div of logo. Useful to position the logo.
- name: icon
  type: object
  required: false
  description: This is the optional icon or custom html next of logo.
  - name: html
    type: string
    required: false
    description: Use this html to insert a custom svg inline icon.
  - name: containerClasses
    type: string
    required: false
    description: Classes applied to the parent div of icon. Useful to position the icon. Defaults to `flex-1`.
- name: containerClasses
  type: string
  required: false
  description: Classes that can be added to the inner container, useful if you want to make the footer full width.
- name: classes
  type: string
  required: false
  description: Classes to add to the footer component container.
- name: attributes
  type: object
  required: false
  description: HTML attributes (for example data attributes) to add to the footer component container.
- name: urlFeder
  type: string
  required: false
  description: (Deprecated, use logo.url instead). Add a custom link to the logo. Defaults to the URL configured in branding.
